[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "system1-audit"
version = "0.1.0"
description = "Calibration, option-order and selective-prediction audits for typed decision models"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Abhijith V S" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
